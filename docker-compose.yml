# Backend only: FastAPI + SQLite in one container, with the scheduler in
# process. The frontend runs separately (see docs/deployment.md).
# Provider keys come from your shell or an env file you do not commit.

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/ai_platform.db
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4.1}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - SCHEDULER_ENABLED=${SCHEDULER_ENABLED:-1}
    volumes:
      - backend_data:/app/data

volumes:
  backend_data:
