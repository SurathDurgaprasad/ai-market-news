[pytest]
pythonpath = .
testpaths = tests
markers =
    live_nvidia: exercises the real NVIDIA API (requires NVIDIA_API_KEY); slower, given a longer timeout override.
    live_openai: exercises the real OpenAI API (requires OPENAI_API_KEY).
# Defense-in-depth only (see docs/security-findings.md NVDA-01): the real
# fix is NVIDIAProvider's own hard per-request deadline
# (app/core/providers/llm.py, ProviderRequestTimeout). This global ceiling
# exists so ANY test that hangs for an unrelated reason fails loudly
# instead of blocking a run indefinitely. Deterministic tests should never
# approach this; live_nvidia-marked tests get an explicit longer timeout.
timeout = 30
timeout_method = thread
